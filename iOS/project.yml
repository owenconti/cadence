# Cadence for iPhone and iPad, for Owen's own devices only: TestFlight internal testing,
# never the App Store. `make testflight` uploads a build; `make phone` generates CadencePhone.xcodeproj from this file (it isn't
# committed), builds, and installs on the connected iPhone; `make phone-sim`
# runs it in the simulator on the demo library.
#
# It compiles the Mac app's models, services and components directly, plus the
# phone's own screens in iOS/Sources. Mac-only code is behind #if os(macOS).
name: CadencePhone
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: HBLWB8LVKC
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../Sources/Cadence/Models
      - path: ../Sources/Cadence/Services
      - path: ../Sources/Cadence/Components
        excludes:
          - ArtworkSnapshot.swift
      - ../Sources/Cadence/App/AppModel.swift
      - ../Sources/Cadence/App/PaletteModel.swift
      - ../Sources/Cadence/App/RunMode.swift
      - ../Sources/Cadence/Views/SplashView.swift
      # The Mac's layout, for a full-width iPad.
      - ../Sources/Cadence/Views/RootView.swift
      - ../Sources/Cadence/Views/Sidebar.swift
      - ../Sources/Cadence/Views/DiscoverView.swift
      - ../Sources/Cadence/Views/PlaylistsView.swift
      - ../Sources/Cadence/Views/ArtistsView.swift
      - ../Sources/Cadence/Views/NowPanel.swift
      - ../Sources/Cadence/Views/NowPlayingView.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only Apple's own encryption (HTTPS), so TestFlight skips the export question.
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: Cadence uses Apple Music to show your library, recommendations, and to play music.
        UIBackgroundModes: [audio]
        # The phone's window is SwiftUI's own; CarPlay gets a scene of its own.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owenconti.cadence
        PRODUCT_NAME: Cadence
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
      configs:
        # CarPlay audio needs an entitlement Apple grants on request; until it
        # does, only Debug (simulator) builds carry it.
        Debug:
          CODE_SIGN_ENTITLEMENTS: CarPlay.entitlements
